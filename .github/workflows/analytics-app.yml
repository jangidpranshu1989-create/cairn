name: analytics-app
on:
  push:
    branches: [main]
    tags: ['analytics-v*']
    paths: ['analytics-app/**', 'server/web/admin/**', '.github/workflows/analytics-app.yml']
  pull_request:
    paths: ['analytics-app/**', 'server/web/admin/**', '.github/workflows/analytics-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Release keystore (same key as the browser)
        working-directory: analytics-app
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
          else echo "No keystore secret: signing with the debug key"; fi
      - name: Build
        working-directory: analytics-app
        run: |
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cd app/build/outputs/apk/release && f=$(ls *.apk | head -1) && mv "$f" Cairn-Analytics.apk
      - uses: actions/upload-artifact@v6
        with:
          name: cairn-analytics
          path: analytics-app/app/build/outputs/apk/release/Cairn-Analytics.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/analytics-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=analytics-app/app/build/outputs/apk/release/Cairn-Analytics.apk
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$APK" --clobber
          else gh release create "$TAG" "$APK" --title "Cairn Analytics ${TAG#analytics-v}" --latest=false \
            --notes "Owner dashboard for Cairn: live users, daily users, installs, retention, website visitors and a home-screen widget. Needs the dashboard key; not for end users. Download: Cairn-Analytics.apk"; fi
