<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http: saarthi:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; media-src 'self' blob:; connect-src 'self'">
<title>Saarthi</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-logo" viewBox="0 0 32 32"><path d="M16 3 4 9.5v13L16 29l12-6.5v-13L16 3Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M10.5 19.5c1.5 1.6 3.4 2.4 5.6 2.4 3.1 0 5.2-1.5 5.2-3.7 0-4.6-10.1-2.5-10.1-6.9 0-1.9 1.9-3.3 4.8-3.3 1.9 0 3.5.6 4.8 1.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Z"/><path d="M19 15c.3 1.9 1 2.7 3 3-2 .3-2.7 1.1-3 3-.3-1.9-1-2.7-3-3 2-.3 2.7-1.1 3-3Z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="4.5" cy="6" r="1.8"/><circle cx="19.5" cy="6" r="1.8"/><circle cx="4.5" cy="18" r="1.8"/><circle cx="19.5" cy="18" r="1.8"/><path d="M6 7l4 3.5M18 7l-4 3.5M6 17l4-3.5M18 17l-4-3.5"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-shot" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19V5"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></symbol>
    <symbol id="i-click" viewBox="0 0 24 24"><path d="m9 9 11 4-5 2-2 5Z"/><path d="M5 3v3M3 5h3M8 4l1.5 1.5"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 10v5M12 18h.01"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3m-6 0 2 2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8Z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  </defs>
</svg>

<header id="tabbar">
  <button class="logo" id="logoBtn" title="Saarthi menu"><svg width="20" height="20"><use href="#i-logo"/></svg></button>
  <div id="tabs" role="tablist"></div>
  <button id="newtab" title="New tab (Ctrl+T)"><svg class="ic"><use href="#i-plus"/></svg></button>
</header>

<nav id="toolbar">
  <button class="tb" id="back" title="Back"><svg class="ic"><use href="#i-back"/></svg></button>
  <button class="tb" id="fwd" title="Forward"><svg class="ic"><use href="#i-fwd"/></svg></button>
  <button class="tb" id="reload" title="Reload"><svg class="ic" id="reloadIc"><use href="#i-reload"/></svg></button>
  <div id="omni">
    <svg class="ic lock" id="lockIc" width="15" height="15"><use href="#i-search"/></svg>
    <input id="url" spellcheck="false" autocomplete="off" placeholder="Search, type a URL, or ask Saarthi to do something…">
    <button class="omni-act" id="askBtn" title="Ask Saarthi (Tab)"><svg class="ic" width="14" height="14"><use href="#i-spark"/></svg>Ask</button>
    <button class="tb" id="star" title="Bookmark (Ctrl+D)" style="width:28px;height:28px"><svg class="ic" width="15" height="15"><use href="#i-star"/></svg></button>
  </div>
  <button class="tb" id="shieldBtn" title="Saarthi Shield: ads & trackers blocked"><svg class="ic"><use href="#i-shield"/></svg><span class="badge hidden" id="shieldCount">0</span></button>
  <button class="tb" id="toolsBtn" title="Page tools: summary, mind map, PDF, screenshot"><svg class="ic"><use href="#i-doc"/></svg></button>
  <button class="tb" id="dlBtn" title="Downloads"><svg class="ic"><use href="#i-down"/></svg><svg id="dlRing" viewBox="0 0 24 24" class="hidden"><circle cx="12" cy="12" r="11" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="69" stroke-dashoffset="69" transform="rotate(-90 12 12)"/></svg></button>
  <button id="assistantBtn" title="Saarthi Assistant (Ctrl+K)"><svg class="ic" width="15" height="15"><use href="#i-spark"/></svg>Assistant</button>
  <button id="avatar" title="Account">?</button>
  <button class="tb" id="menuBtn" title="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
</nav>

<div class="bar" id="permBar">
  <svg class="ic" style="color:var(--agent)"><use href="#i-shield"/></svg>
  <div class="grow" id="permText">Permission request</div>
  <button class="btn" data-perm="block">Block</button>
  <button class="btn" data-perm="once">Allow this time</button>
  <button class="btn primary" data-perm="allow">Allow</button>
</div>
<div class="bar" id="pwBar">
  <svg class="ic" style="color:var(--accent)"><use href="#i-key"/></svg>
  <div class="grow" id="pwText">Save password?</div>
  <button class="btn" data-pw="never">Never for this site</button>
  <button class="btn" data-pw="dismiss">Not now</button>
  <button class="btn primary" data-pw="save">Save</button>
</div>
<div class="bar" id="findBar">
  <svg class="ic"><use href="#i-search"/></svg>
  <input id="findInput" placeholder="Find in page" spellcheck="false">
  <span id="findCount"></span>
  <button class="tb" id="findPrev" title="Previous"><svg class="ic" style="transform:rotate(90deg)"><use href="#i-back"/></svg></button>
  <button class="tb" id="findNext" title="Next"><svg class="ic" style="transform:rotate(90deg)"><use href="#i-fwd"/></svg></button>
  <div class="grow"></div>
  <button class="tb" id="findClose" title="Close"><svg class="ic"><use href="#i-x"/></svg></button>
</div>
<div id="toasts" aria-live="polite"></div>

<main id="main">
  <div id="pageWrap"><div id="page"></div><img id="freeze" alt=""></div>
  <div id="resizer"></div>
  <aside id="panel" aria-label="Saarthi Assistant">
    <div class="ph">
      <div class="title"><svg class="mark"><use href="#i-logo"/></svg>Saarthi <span class="model" id="modelTag">AI</span></div>
      <button class="tb" id="newChat" title="New conversation"><svg class="ic"><use href="#i-new"/></svg></button>
      <button class="tb" id="closePanel" title="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="thread"></div>
    <div id="player">
      <div class="eq"><i></i><i></i><i></i><i></i></div>
      <div class="pt" id="playerTitle">Reading aloud</div>
      <select id="rate" title="Speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button class="tb" id="playPause" style="width:28px;height:28px" title="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
      <button class="tb" id="playStop" style="width:28px;height:28px" title="Stop"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="composer">
      <div class="cbox">
        <textarea id="input" rows="1" placeholder="Ask anything or give Saarthi a task…"></textarea>
        <div class="crow">
          <button class="chip" id="ctxChip" title="Include current page"><svg class="ic" width="12" height="12"><use href="#i-globe"/></svg><span id="ctxLabel">This page</span></button>
          <div style="flex:1"></div>
          <button id="mic" title="Speak"><svg class="ic"><use href="#i-mic"/></svg></button>
          <button id="send" title="Send" disabled><svg class="ic"><use href="#i-send"/></svg></button>
        </div>
      </div>
      <div class="hint">Saarthi can make mistakes. Payments always need your approval.</div>
    </div>
  </aside>
</main>

<div class="pop" id="omniPop"></div>
<div class="pop" id="toolsPop">
  <div class="mh">This page</div>
  <div class="opt" data-tool="summary"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-spark"/></svg></span><span class="ot">Summarize</span></div>
  <div class="opt" data-tool="mindmap"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-map"/></svg></span><span class="ot">Mind map</span></div>
  <div class="opt" data-tool="read"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-speak"/></svg></span><span class="ot">Read aloud</span></div>
  <div class="opt" data-tool="reader"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-book"/></svg></span><span class="ot">Reader view</span></div>
  <div class="sep"></div>
  <div class="opt" data-tool="pdf"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-doc"/></svg></span><span class="ot">Save page as PDF</span><kbd>Ctrl Shift S</kbd></div>
  <div class="opt" data-tool="readerpdf"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-book"/></svg></span><span class="ot">Clean article PDF</span></div>
  <div class="opt" data-tool="longshot"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-shot"/></svg></span><span class="ot">Long screenshot</span><kbd>Ctrl Shift L</kbd></div>
  <div class="opt" data-tool="shot"><span class="oi"><svg class="ic" width="14" height="14"><use href="#i-camera"/></svg></span><span class="ot">Visible screenshot</span></div>
</div>
<div class="pop" id="dlPop"></div>

<script src="md.js"></script>
<script src="ui.js"></script>
</body>
</html>
