<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Cairn Account</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="cairn://account/pages/internal.css">
<style>
.auth{min-height:100vh;display:grid;place-items:center;padding:30px}
.panel{width:min(420px,100%);animation:fade .35s ease-out}
.panel .logo{display:flex;justify-content:center;margin-bottom:18px}
.panel h1{text-align:center;font-size:28px}.panel>.muted{text-align:center;margin:6px 0 24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
form .input{height:42px}
.cap{display:none;gap:10px;align-items:center}.cap.on{display:flex}
.cap .img{background:#fff;border-radius:10px;height:46px;width:150px;display:grid;place-items:center;overflow:hidden;flex:none}
.cap .img svg{width:150px;height:46px}
.err{color:var(--err);font-size:13px;min-height:18px}
.btn.big{height:44px;justify-content:center;font-size:14px;border-radius:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:14px 0 10px}.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line-2)}
.me{display:flex;gap:16px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 22px 'Inter'}
.perks{display:grid;gap:10px;margin:20px 0}
.perks div{display:flex;gap:10px;align-items:center;font-size:13.5px}.perks .ic{color:var(--ok)}
</style></head>
<body><div class="auth"><div class="panel" id="root"></div></div>
<script src="cairn://account/pages/internal.js"></script><script src="cairn://account/pages/account.js"></script></body></html>
