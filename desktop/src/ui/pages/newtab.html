<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>New Tab</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="saarthi://newtab/pages/internal.css"><link rel="stylesheet" href="saarthi://newtab/pages/newtab.css"></head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="nt">
  <h1 class="wordmark" aria-label="Saarthi"><svg class="mark" width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25L16 2.5Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M20.5 11.5c-1-1.3-2.6-2-4.4-2-2.6 0-4.4 1.4-4.4 3.3 0 4.4 9 2.3 9 6.6 0 2-1.9 3.3-4.6 3.3-1.9 0-3.6-.8-4.6-2.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg><span>saarthi</span></h1>
  <form id="box" class="box" autocomplete="off">
    <textarea id="q" rows="1" placeholder="Ask anything or give Saarthi a task…" aria-label="Ask or search"></textarea>
    <div class="row">
      <div class="modes" role="tablist" aria-label="Mode">
        <button type="button" class="m on" data-m="ask" role="tab" aria-selected="true" title="Ask the assistant or run a task"><svg class="ic" viewBox="0 0 24 24" width="14" height="14"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Z"/></svg>Assistant</button>
        <button type="button" class="m" data-m="search" role="tab" aria-selected="false" title="Search the web"><svg class="ic" viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
      </div>
      <span class="kbd" id="hintKey">Tab to switch</span>
      <button class="go" type="submit" aria-label="Submit" disabled><svg class="ic" viewBox="0 0 24 24" width="17" height="17"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
    </div>
  </form>
  <div class="ideas" id="ideas" aria-label="Try"></div>
  <section class="tiles" id="tiles" aria-label="Shortcuts"></section>
  <section class="cards">
    <article class="wcard" id="recent"><header><span>Jump back in</span><a href="saarthi://history">History</a></header><div class="rl" id="recentList"><p class="muted small">Pages you visit will show up here.</p></div></article>
    <article class="wcard" id="today"><header><span id="dateLbl">Today</span><span class="muted small" id="clock"></span></header>
      <div class="stat"><b id="shieldN">0</b><span>trackers &amp; ads blocked by Shield</span></div>
      <div class="qa">
        <a href="saarthi://downloads">Downloads</a><a href="saarthi://bookmarks">Bookmarks</a><a href="saarthi://passwords">Passwords</a><a href="saarthi://settings">Settings</a>
      </div>
    </article>
  </section>
</main>
<script src="saarthi://newtab/pages/internal.js"></script><script src="saarthi://newtab/pages/newtab.js"></script>
</body></html>
