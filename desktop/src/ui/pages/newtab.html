<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>New Tab</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="cairn://newtab/pages/internal.css"><link rel="stylesheet" href="cairn://newtab/pages/newtab.css"></head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="nt">
  <h1 class="wordmark" aria-label="Cairn"><svg class="mark" width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" d="M4.3 17.4c0-2 3.4-3.3 7.9-3.3 4.4 0 7.5 1.3 7.5 3.3 0 1.8-3 2.9-7.6 2.9-4.7 0-7.8-1.1-7.8-2.9Z"/><path fill="currentColor" d="M6.6 11c0-1.7 2.3-2.9 5.3-2.9 3 0 4.9 1.1 4.9 2.7 0 1.6-2.1 2.6-5.1 2.6-3 0-5.1-1-5.1-2.4Z"/><path fill="var(--agent,#D9C3A0)" d="M9.3 5.75c0-1.3 1.3-2.3 3.1-2.3 1.7 0 2.7.9 2.7 2.1 0 1.2-1.2 2-2.9 2-1.8 0-2.9-.7-2.9-1.8Z"/></svg><span>cairn</span></h1>
  <form id="box" class="box" autocomplete="off">
    <textarea id="q" rows="1" placeholder="Ask anything or give Cairn a task…" aria-label="Ask or search"></textarea>
    <div class="row">
      <div class="modes" role="tablist" aria-label="Mode">
        <button type="button" class="m on" data-m="ask" role="tab" aria-selected="true" title="Ask the assistant or run a task"><svg class="ic" viewBox="0 0 24 24" width="14" height="14"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Z"/></svg>Assistant</button>
        <button type="button" class="m" data-m="search" role="tab" aria-selected="false" title="Search the web"><svg class="ic" viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
      </div>
      <span class="kbd" id="hintKey">Tab to switch</span>
      <button class="go" type="submit" aria-label="Submit" disabled><svg class="ic" viewBox="0 0 24 24" width="17" height="17"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
    </div>
  </form>
  <div class="ideas" id="ideas" aria-label="Try"></div>
  <section class="tiles" id="tiles" aria-label="Shortcuts"></section>
  <section class="cards">
    <article class="wcard" id="recent"><header><span>Jump back in</span><a href="cairn://history">History</a></header><div class="rl" id="recentList"><p class="muted small">Pages you visit will show up here.</p></div></article>
    <article class="wcard" id="today"><header><span id="dateLbl">Today</span><span class="muted small" id="clock"></span></header>
      <div class="stat"><b id="shieldN">0</b><span>trackers &amp; ads blocked by Shield</span></div>
      <div class="qa">
        <a href="cairn://downloads">Downloads</a><a href="cairn://bookmarks">Bookmarks</a><a href="cairn://passwords">Passwords</a><a href="cairn://settings">Settings</a>
      </div>
    </article>
  </section>
</main>
<script src="cairn://newtab/pages/internal.js"></script><script src="cairn://newtab/pages/newtab.js"></script>
</body></html>
