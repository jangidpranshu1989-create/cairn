<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Reader</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="cairn://reader/pages/internal.css">
<style>
body{background:var(--bg-2)}
article{max-width:700px;margin:0 auto;padding:56px 28px 100px;font:18px/1.75 'Inter',Georgia,serif}
article h1{font-size:clamp(28px,4vw,40px);margin-bottom:10px}
.meta{color:var(--muted);font-size:13.5px;margin-bottom:34px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
article p{margin:0 0 1.1em}article h2{margin:1.6em 0 .5em;font-size:24px}
.tools{position:sticky;top:0;display:flex;justify-content:flex-end;gap:6px;padding:10px 18px;background:color-mix(in srgb,var(--bg-2) 85%,transparent);backdrop-filter:blur(8px);z-index:2}
body.serif article{font-family:Georgia,'Noto Serif',serif}
</style></head>
<body><div class="tools"><button class="btn sm" id="minus">A−</button><button class="btn sm" id="plus">A+</button><button class="btn sm" id="font">Serif</button><button class="btn sm primary" id="listen">Listen</button></div>
<article id="a"><p class="muted">Loading…</p></article>
<script src="cairn://reader/pages/internal.js"></script><script src="cairn://reader/pages/reader.js"></script></body></html>
