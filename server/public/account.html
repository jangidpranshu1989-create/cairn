<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saarthi Account</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card" id="app">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-label="Saarthi"><path d="M16 3 4 9.5v13L16 29l12-6.5v-13L16 3Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 19.5c1.6 1.7 3.6 2.5 6 2.5 3.3 0 5.5-1.6 5.5-3.9 0-4.8-10.6-2.6-10.6-7.2 0-2 2-3.4 5-3.4 2 0 3.7.6 5 1.9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    Saarthi
  </div>

  <!-- Sign in / Sign up -->
  <section id="auth">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to sync your browser and pair your phone.</p>
    <form id="form" novalidate>
      <div id="nameWrap" class="hidden"><label for="name">Name</label><input id="name" autocomplete="name"></div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="username webauthn" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="10">
      <div class="captcha" id="captcha">
        <label>Type the characters you see</label>
        <div class="img"><div id="captchaImg"></div><button type="button" id="captchaRefresh" aria-label="New captcha">&#8635;</button></div>
        <input id="captchaAnswer" autocomplete="off" maxlength="8">
      </div>
      <button class="btn primary" id="submit" type="submit">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button class="btn ghost" id="passkeyLogin" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7 1.4 0 2.6.4 3.7 1"/><circle cx="18" cy="15" r="2.5"/><path d="M18 17.5V22m0-2h2"/></svg>
      Sign in with a passkey
    </button>
    <div class="msg" id="msg" role="status"></div>
    <div class="switch"><span id="switchText">New to Saarthi?</span> <a href="#" id="switchLink">Create an account</a> · <a href="#" id="forgot">Forgot password?</a></div>
    <p class="legal">By continuing you agree to the <a href="https://saarthi.app/terms.html">Terms</a> and <a href="https://saarthi.app/privacy.html">Privacy Policy</a>.</p>
  </section>

  <!-- Signed in -->
  <section id="profile" class="hidden">
    <h1>Your account</h1>
    <p class="sub" id="who"></p>
    <label>Passkeys</label>
    <div class="list" id="passkeys"></div>
    <button class="btn ghost" id="addPasskey" type="button">Add a passkey on this device</button>
    <label style="margin-top:22px">Active sessions</label>
    <div class="list" id="sessions"></div>
    <button class="btn ghost" id="logout" type="button">Sign out</button>
    <div class="msg" id="msg2" role="status"></div>
  </section>
</main>
<script src="/vendor/simplewebauthn.js"></script>
<script src="/account.js"></script>
</body>
</html>
