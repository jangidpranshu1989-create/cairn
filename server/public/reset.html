<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password · Saarthi</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card">
<div class="brand">Saarthi</div>
<h1>Choose a new password</h1>
<p class="sub">At least 10 characters, with letters and numbers.</p>
<form id="f"><label for="p">New password</label><input id="p" type="password" autocomplete="new-password" required minlength="10">
<button class="btn primary">Update password</button></form>
<div class="msg" id="m" role="status"></div>
</main>
<script src="/reset.js"></script></body></html>
